<style>
  :root { --ink: #21141c; --bg: #0d0a14; --gold: #ffd23a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
  canvas#game { display: block; image-rendering: auto; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #ffe9b0; font: 600 20px system-ui, sans-serif; letter-spacing: .04em; }
  #corner { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 8px; z-index: 5; }
  #corner button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); background: rgba(255,250,240,.7); color: var(--ink); font: 700 16px system-ui; padding: 0; cursor: pointer; display: grid; place-items: center; }
  #corner button.off::after { content: ''; position: absolute; width: 30px; height: 3px; background: #d33; transform: rotate(-45deg); }
  #corner button { position: relative; }
  #corner button[hidden] { display: none; }
  /* the touch target: 44 px round each 34 px button (the 44 pt guideline, QA N9) -- a transparent disc that takes the tap;
     the look and the corner's box (src/main.js cornerBox: #corner's own rect) unchanged */
  #corner button::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; }
  /* every book: gone while a gamepad plays -- START pauses -- and back on a mouse or a touch (body.padui: src/main.js
     App.padUi); Book Two (body.si) also keeps them inside a TV's 5% action-safe area */
  #corner { transition: opacity .3s; }
  body.padui #corner { opacity: 0; pointer-events: none; }
  body.si #corner { top: max(5vh, env(safe-area-inset-top)); right: max(calc(5vw + 2px), env(safe-area-inset-right)); }
  #fsBtn svg { width: 18px; height: 18px; display: block; }
  #fsBtn .shrink, #fsBtn.on .grow { display: none; }
  #fsBtn.on .shrink { display: block; }
  .nocursor, .nocursor * { cursor: none !important; }
  #fsTip { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 9; max-width: min(88vw, 460px); padding: 18px 22px; border-radius: 16px; border: 4px solid var(--ink); background: #fff6e0; color: var(--ink); font: 600 17px/1.45 system-ui, sans-serif; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.35); }
  #fsTip .x { display: inline-block; margin-top: 12px; padding: 6px 22px; border-radius: 999px; border: 3px solid var(--ink); background: var(--gold); font-weight: 800; cursor: pointer; }
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch:not(.playing) #pads { display: none; }
  body.story #mute, body.story #pauseBtn, body.story #fsBtn { opacity: 0.35; }
  /* phones in landscape: canvas to the left so the buttons sit in the right-hand gutter */
  @media (max-height: 500px) {
    body.touch { place-items: center start; padding-left: env(safe-area-inset-left); }
    body.touch #pads { transform: scale(.76); transform-origin: bottom right; right: max(6px, env(safe-area-inset-right)); bottom: max(6px, env(safe-area-inset-bottom)); }
    body.touch #bD { right: 116px; bottom: 186px; }   /* (in the gutter, over SHOOT: the play area stays clear) */
  }
  #stickzone { position: fixed; left: 0; top: 0; width: 50%; height: 100%; z-index: 3; }
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); background: rgba(20,14,30,.25); display: none; z-index: 4; pointer-events: none; }
  #stick.on { display: block; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,240,210,.75); border: 3px solid var(--ink); transform: translate(-50%,-50%); }
  #pads { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: 266px; height: 190px; z-index: 4; }
  #pads [data-act] { position: absolute; opacity: .75; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center; font: 400 18px Bangers, Impact, sans-serif; letter-spacing: .03em; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.35); touch-action: none; }
  #pads [data-act].down { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); filter: brightness(1.15); opacity: 1; }   /* (idle .75: the arena shows through) */
  #bA { width: 92px; height: 92px; right: 0; bottom: 0; background: #ff9a3a; }
  #bJ { width: 74px; height: 74px; right: 106px; bottom: 6px; background: #8fd0ff; }
  body[data-hint="attack"] #bA, body[data-hint="cmelee"] #bA, body[data-hint="special"] #bS { animation: pulse .7s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.14); box-shadow: 0 0 0 6px rgba(255,226,120,.8); } }
  @media (prefers-reduced-motion: reduce) { body[data-hint] #bA, body[data-hint] #bS, body[data-hint] #bF, body[data-hint] #bD { animation: none; } }
  #bF { width: 62px; height: 62px; right: 112px; bottom: 100px; background: #b6e35a; }
  body[data-hint="shoot"] #bF, body[data-hint="charge"] #bF { animation: pulse .7s ease-in-out infinite alternate; }
  #bD { width: 64px; height: 64px; right: 200px; bottom: 8px; background: #c9a7ff; font-size: 16px; transition: opacity .15s; }
  body.dodgecd #bD { opacity: .45; }
  body[data-hint="dodge"] #bD { animation: pulse .7s ease-in-out infinite alternate; }
  #bS { width: 70px; height: 70px; right: 20px; bottom: 108px; background: #ff5a3a; color: #fff6e0 !important; }
</style>
